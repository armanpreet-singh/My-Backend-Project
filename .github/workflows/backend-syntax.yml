name: Backend Syntax and Auth Tests

on:
  pull_request:
    paths:
      - "src/controllers/user.controller.js"
      - "src/routes/user.routes.js"
      - "src/utils/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  push:
    branches:
      - main

jobs:
  syntax-and-auth-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check authentication and profile modules
        run: npm run check

      - name: Run auth regression tests
        run: npm test
